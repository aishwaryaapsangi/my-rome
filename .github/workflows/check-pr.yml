name: Check flight comparison PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Exercise in-app fare comparison
        run: npm test
      - name: Compile Angular for GitHub Pages
        run: npm run build -- --base-href /my-rome/
