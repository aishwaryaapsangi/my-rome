name: Deploy private flight search API (Cloudflare Workers)

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api-worker
          command: deploy

# The search endpoint defaults OFF until the owner authorizes OAuth and enables it.
# No LetsFG credentials belong in GitHub Actions or the public website.
